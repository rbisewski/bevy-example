[package]
name = "bevy-example"
version = "1.1.0"
authors = ["Robert Bisewski <rbisewski@ibiscybernetics.com>"]
edition = "2024"
rust-version = "1.95"
resolver = "2"

[profile.release]
opt-level = "s"
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = true
codegen-units = 16
rpath = false
strip = "symbols"

[dependencies]
fastrand = { version = "2.4.1", features = ["js"] }
bevy = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
